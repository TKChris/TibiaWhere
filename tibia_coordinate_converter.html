<style>
  .converter-wrap { padding: 1rem 0; font-family: var(--font-sans); }
  .input-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; }
  .input-row input { flex: 1; }
  .result-card { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .result-label { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; }
  .result-value { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); word-break: break-all; }
  .coords-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
  .coord-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.75rem 1rem; text-align: center; }
  .coord-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .coord-num { font-size: 22px; font-weight: 500; color: var(--color-text-primary); font-family: var(--font-mono); }
  .copy-btn { width: 100%; margin-top: 0.5rem; }
  .error { color: var(--color-text-danger); font-size: 13px; margin-top: 6px; display: none; }
  .hint { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 1rem; }
</style>

<div class="converter-wrap">
  <h2 class="sr-only">TibiaWiki coordinate converter</h2>

  <p class="hint">Paste a TibiaWiki Mapper URL or just the coords like <code>128.85-124.180-7</code></p>

  <div class="input-row">
    <input type="text" id="coord-input" placeholder="128.85-124.180-7 or full URL" oninput="convert()" />
    <button onclick="document.getElementById('coord-input').value=''; document.getElementById('coord-input').focus(); convert();" style="white-space:nowrap;">Clear</button>
  </div>

  <p class="error" id="error-msg">Could not parse coordinates. Try format: 128.85-124.180-7</p>

  <div id="results" style="display:none;">
    <div class="coords-row">
      <div class="coord-card">
        <div class="coord-label">X</div>
        <div class="coord-num" id="out-x">—</div>
      </div>
      <div class="coord-card">
        <div class="coord-label">Y</div>
        <div class="coord-num" id="out-y">—</div>
      </div>
      <div class="coord-card">
        <div class="coord-label">Floor</div>
        <div class="coord-num" id="out-floor">—</div>
      </div>
    </div>

    <div class="result-card">
      <div class="result-label">Ready to paste into monsters.json</div>
      <div class="result-value" id="json-out"></div>
    </div>

    <button class="copy-btn" id="copy-btn" onclick="copyJSON()">Copy JSON snippet</button>
  </div>
</div>

<script>
function parseCoords(raw) {
  raw = raw.trim();
  if (raw.includes('coords=')) {
    const match = raw.match(/coords=([0-9.]+)-([0-9.]+)-([0-9]+)/);
    if (match) return [match[1], match[2], match[3]];
  }
  const parts = raw.split(/[-,\s]+/);
  if (parts.length >= 3) return [parts[0], parts[1], parts[2]];
  return null;
}

function toTibiaCoord(str) {
  const [whole, dec] = str.split('.');
  const w = parseInt(whole, 10);
  const d = dec ? parseInt(dec, 10) : 0;
  return w * 256 + d;
}

function convert() {
  const raw = document.getElementById('coord-input').value;
  const err = document.getElementById('error-msg');
  const results = document.getElementById('results');

  if (!raw.trim()) { err.style.display = 'none'; results.style.display = 'none'; return; }

  const parts = parseCoords(raw);
  if (!parts) { err.style.display = 'block'; results.style.display = 'none'; return; }

  err.style.display = 'none';

  const x = toTibiaCoord(parts[0]);
  const y = toTibiaCoord(parts[1]);
  const floor = parseInt(parts[2], 10);

  document.getElementById('out-x').textContent = x;
  document.getElementById('out-y').textContent = y;
  document.getElementById('out-floor').textContent = floor;

  const json = `{ "x": ${x}, "y": ${y}, "floor": ${floor}, "label": "Location TBD", "note": "" }`;
  document.getElementById('json-out').textContent = json;
  document.getElementById('copy-btn').textContent = 'Copy JSON snippet';

  results.style.display = 'block';
}

function copyJSON() {
  const text = document.getElementById('json-out').textContent;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copy-btn').textContent = 'Copied!';
    setTimeout(() => document.getElementById('copy-btn').textContent = 'Copy JSON snippet', 2000);
  });
}
</script>
